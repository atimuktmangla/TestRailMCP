[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testrail-mcp"
version = "0.1.0"
description = "MCP server for TestRail REST API with LLM-assisted test case creation"
readme = "README.md"
# Minimum 3.11; all newer CPython 3.x (3.12, 3.13, …) are supported.
requires-python = ">=3.11"
dependencies = [
  # Capped below 2.0: mcp 2.x removed mcp.shared.memory.create_connected_server_and_client_session,
  # which scripts/verify_e2e.py uses for the in-process MCP check. Tested against 1.27.0.
  "mcp[cli]>=1.10.0,<2",
  "httpx>=0.27.0",
  "openai>=1.50.0",
  "pydantic-settings>=2.5.0",
  "uvicorn>=0.31.0",
  "starlette>=0.37.0",
]

[project.scripts]
testrail-mcp = "testrail_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["testrail_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "testrail_mcp",
  "README.md",
  "skills",
  "docs",
  "prompts",
  "scripts",
]
